services:
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:${API_HOST_PORT:-8010}
    ports:
      - "${FRONTEND_HOST_PORT:-5174}:5173"
    depends_on:
      - api

  redis:
    image: redis:7-alpine

  api:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_HOST_PORT:-8010}:8000"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - redis

  worker:
    build:
      context: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - redis
